name: ocp-indent
run-name: "ocp-indent ${{ inputs.leg || github.event_name }} ${{ inputs.racecar_run }}"

on:
  pull_request:
  push:

  workflow_dispatch:
    inputs:
      leg:
        description: "baseline (uninstrumented) or instrumented (under chalk/curiosity)"
        type: choice
        options: [instrumented, baseline]
        default: baseline
      profile:
        description: "CrashOverride chalk profile"
        type: string
        default: curiosity-tests-racecar
      racecar_run:
        description: "racecar correlation token, echoed into the run name"
        type: string
        default: ""

env:
  CHALK_ON: ${{ inputs.leg == 'instrumented' }}
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            ocaml-compiler: 4.11.x
          - os: ubuntu-latest
            ocaml-compiler: 4.14.x
          - os: ubuntu-latest
            ocaml-compiler: 5.0.x
          - os: ubuntu-latest
            ocaml-compiler: 5.1.x
          - os: ubuntu-latest
            ocaml-compiler: 5.2.x
          - os: ubuntu-latest
            ocaml-compiler: 5.3.x

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Use OCaml ${{ matrix.ocaml-compiler }}
        uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: ${{ matrix.ocaml-compiler }}

      - run: opam install . --deps-only
      - run: opam exec -- dune build @install
      - run: opam install . --deps-only -t
      - run: opam exec -- dune runtest
      - run: opam exec -- dune build @fmt
      - run: opam config report
      - run: opam install .
      - run: opam exec ocp-indent --help
